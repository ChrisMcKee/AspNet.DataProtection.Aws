name: Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'test/**/*.cs'
      - 'test/**/*.csproj'

env:
  DOTNET_NOLOGO: true
  TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  build_and_pack_release:
    name: Build and pack preview package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build version prefix/suffix
        run: |
          echo "VERSION_PREFIX=${{ github.run_number }}.0.0" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=alpha.${{ github.run_attempt }}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - run: dotnet restore ./AspNet.DataProtection.Aws.sln --verbosity minimal

      - run: dotnet build ./AspNet.DataProtection.Aws.sln --configuration Release -p:ContinuousIntegrationBuild=true -p:VersionPrefix=$VERSION_PREFIX --version-suffix $VERSION_SUFFIX --verbosity minimal

      - name: Run tests
        run: dotnet test ./test/Tests/Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Pack S3 NuGet package
        run: dotnet pack ./src/AspNet.DataProtection.Aws.S3/AspNet.DataProtection.Aws.S3.csproj --configuration Release --no-build --output ./artifacts -p:VersionPrefix=$VERSION_PREFIX --version-suffix $VERSION_SUFFIX -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Pack KMS NuGet package
        run: dotnet pack ./src/AspNet.DataProtection.Aws.Kms/AspNet.DataProtection.Aws.Kms.csproj --configuration Release --no-build --output ./artifacts -p:VersionPrefix=$VERSION_PREFIX --version-suffix $VERSION_SUFFIX -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NuGetPackage.${{ env.VERSION_PREFIX }}-${{ env.VERSION_SUFFIX }}.nupkg.zip
          path: ./artifacts/*
