name: Build Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  SIMPLYSIGN_URL: 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi'

jobs:
  build_and_create_a_nuget:
    name: Build and create release NuGet package
    runs-on: ubuntu-latest

    steps:
      - name: Calculate version from the Commit Tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - run: dotnet restore ./AspNet.DataProtection.Aws.sln --verbosity minimal

      - run: dotnet build ./AspNet.DataProtection.Aws.sln --configuration Release -p:ContinuousIntegrationBuild=true -p:version=${{ env.RELEASE_VERSION }} --verbosity minimal

      - name: Run tests
        run: dotnet test ./test/Tests/Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Pack S3 NuGet package
        run: dotnet pack ./src/AspNet.DataProtection.Aws.S3/AspNet.DataProtection.Aws.S3.csproj --configuration Release --no-build --output ./artifacts -p:version=${{ env.RELEASE_VERSION }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Pack KMS NuGet package
        run: dotnet pack ./src/AspNet.DataProtection.Aws.Kms/AspNet.DataProtection.Aws.Kms.csproj --configuration Release --no-build --output ./artifacts -p:version=${{ env.RELEASE_VERSION }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./artifacts/*

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: NuGetPackage.${{ env.RELEASE_VERSION }}.nupkg.zip
          files: ./artifacts/*

      - name: Publish to GPR
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts"
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --no-symbols \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --source https://nuget.pkg.github.com/${{ github.repository_owner }}
          done

  sign_and_publish_nuget:
    name: Sign and publish to NuGet.org
    needs: build_and_create_a_nuget
    runs-on: windows-latest

    steps:
      - name: Calculate version from the Commit Tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Download artifacts from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: ./artifacts/

      - name: List downloaded artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path ./artifacts -Recurse | Format-Table FullName, Length

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Cache SimplySign Installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SimplySignDesktop.msi
          key: simplysign-msi-${{ env.SIMPLYSIGN_URL }}

      - name: Setup Certum SimplySign environment
        uses: chrismckee/windows-app-signing-setup-action@main
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          simplysign-url: ${{ env.SIMPLYSIGN_URL }}

      - name: Sign packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in ./artifacts"
          }

          foreach ($package in $packages) {
            dotnet nuget sign $package.FullName `
              --certificate-subject-name "Open Source Developer Christopher McKee" `
              --timestamper http://timestamp.certum.pl
          }

      - name: Publish signed packages to GPR
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in ./artifacts"
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --no-symbols `
              --api-key ${{ secrets.GITHUB_TOKEN }} `
              --source https://nuget.pkg.github.com/${{ github.repository_owner }} `
              --skip-duplicate
          }

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ChrisMcKee

      - name: Publish signed packages to nuget.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in ./artifacts"
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key ${{steps.login.outputs.NUGET_API_KEY}} `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
